      async function generateReview() {
        if (!genInput.trim()) return;
        setGenLoading(true); setLiveReview(null);
        const text = await callClaude(
          `Write an AI-generated cult film review for: "${genInput}". Return ONLY a JSON object with: title (movie name in caps), badge (3-4 word label), rating ("5/5"), excerpt (2 sentence hook), full (150-word unhinged cult review). No markdown, just raw JSON.`,
          "You are an unhinged AI film critic who writes revisionist cult reviews. Voice: obsessive, conspiratorial, sincere. Output ONLY valid JSON, no backticks."
        );
        try { setLiveReview(JSON.parse(text.replace(/```json|```/g,"").trim())); }
        catch { setLiveReview({ title:genInput.toUpperCase(), badge:"MISUNDERSTOOD MASTERPIECE", rating:"5/5", excerpt:text.slice(0,120)+"...", full:text }); }
        setGenLoading(false);
      }

      function addToVault() {
        if (!liveReview) return;
        setReviews(p=>[liveReview,...p]);
        setLiveReview(null); setGenInput("");
      }

      function generateTitle() {
        if (!firstName.trim()||!birthMonth||!petName.trim()) { setTitleOutput("FILL IN ALL THREE FIELDS"); setTitleVars([]); return; }
        const creature = LETTER_CREATURE[firstName.trim()[0].toUpperCase()]||"MUTANT";
        const place    = LETTER_PLACE[petName.trim()[0].toUpperCase()]||"SWAMP";
        const adj      = MONTH_ADJ[birthMonth]||"CURSED";
        const genres   = selGenre ? [selGenre] : Object.keys(GENRE_DATA);
        const vars = genres.map(g => {
          const s = GENRE_DATA[g].structures;
          return { genre:g, title: s[Math.floor(Math.random()*s.length)](adj.toUpperCase(),creature.toUpperCase(),place.toUpperCase()) };
        });
        setTitleOutput(vars[0].title); setTitleVars(vars);
      }

      function copyTitle() {
        navigator.clipboard.writeText(`My Tubi Original: ${titleOutput} — find yours at bside.tubi.tv #BSide #Tubi`);
        setShowCopied(true); setTimeout(()=>setShowCopied(false),2200);
      }

      const isPlaceholder = t => t==="FILL IN ALL THREE FIELDS"||t==="ENTER YOUR DETAILS BELOW";

      return (
        <div className="bside-root">
          <div className="grain"/>
          <div className="scanlines"/>
          <Confetti active={showConfetti}/>
          {showCopied && <div className="copied-toast">COPIED TO CLIPBOARD ✓</div>}

          {modalReview && (
            <div className="modal-overlay" onClick={e=>e.target.className==="modal-overlay"&&setModalReview(null)}>
              <div className="modal">
                <button className="modal-close" onClick={()=>setModalReview(null)}>✕</button>
                <div className="modal-title">{modalReview.title}</div>
                <div className="modal-meta">{modalReview.year||""} · {modalReview.badge}</div>
                <div className="modal-body">"{modalReview.full}"</div>
                <div className="modal-rating">{modalReview.rating} ★</div>
              </div>
            </div>
          )}

          <nav className="nav">
            <div className="nav-logo">B-SIDE <sup>by tubi</sup></div>
            <div className="nav-tabs">
              {["hunt","reviews","generator"].map(t=>(
                <button key={t} className={`nav-tab ${tab===t?"active":""}`} onClick={()=>setTab(t)}>
                  {t==="hunt"?"The Hunt":t==="reviews"?"Cult Reviews":"Title Generator"}
                </button>
              ))}
            </div>
          </nav>

          {tab==="hunt" && (
            <>
              <div className="hero">
                <div className="hero-bg"/>
                <p className="hero-eyebrow">500 titles. A few golden tickets. Zero hints.</p>
                <h1 className="hero-title">
                  B:SIDE<br/>
                  <span className="hero-scratch">Hidden Gems</span>
                </h1>
                <p className="hero-sub">Somewhere inside Tubi's most unhinged, overlooked, criminally underrated catalog, there are golden tickets. Watch to the end. Scan the code. Find out if the universe is finally rewarding your terrible taste in movies.</p>
                <div className="ticker-wrap">
                  <span className="ticker-inner">{TICKER+TICKER+TICKER}</span>
                </div>
              </div>
              <hr className="divider"/>
              <div className="code-section">
                <div className="code-section-inner">
                  <div className="section-label">▶ Golden Ticket</div>
                  <h2 className="section-title">ENTER YOUR<br/><span className="red">SECRET CODE</span></h2>
                  <p style={{color:"#aaa",fontSize:"15px",lineHeight:"1.8",maxWidth:"480px"}}>Found a code at the end of a B-Side title? You finished something weird. That alone deserves acknowledgment. Now find out if the universe is rewarding you.</p>
                  <div className="code-row">
                    <input className="code-input" value={code} onChange={handleCode} placeholder="XXXX-XXXX" maxLength={9}/>
                    <button className="code-btn" onClick={checkCode} disabled={code.replace("-","").length<6}>REVEAL</button>
                  </div>
                  <p className="code-hint">TRY: GOLD-TICK for winner · any other code for the loser flow</p>
                  {codeResult==="winner" && (
                    <div className="result winner">
                      <div style={{fontSize:"44px",marginBottom:"14px"}}>🎟️</div>
                      <div className="result-title">YOU FOUND IT.</div>
                      <p className="result-body">Against all probability and every law of statistics, you are holding a golden ticket. This is real. This is happening. Please screenshot this immediately because no one will believe you. A Tubi representative will contact you via the email on your account. We're also freaking out right now.</p>
                      <button className="tubi-link yellow">CLAIM YOUR PRIZE →</button>
                    </div>
                  )}
                  {codeResult==="loser" && (
                    <div className="result loser">
                      <div style={{fontSize:"44px",marginBottom:"14px"}}>📼</div>
                      <div className="result-title">{loserMsg.headline}</div>
                      <p className="result-body">{loserMsg.sub}</p>
                      <a className="tubi-link" href="https://tubi.tv" target="_blank">GET BACK ON TUBI →</a>
                    </div>
                  )}
                </div>
              </div>
            </>
          )}

          {tab==="reviews" && (
            <div className="section">
              <div className="section-label">▶ Cult Reviews</div>
              <h2 className="section-title">AI-GENERATED<br/><span className="red">CRITICAL REASSESSMENTS</span></h2>
              <p style={{color:"#aaa",fontSize:"15px",lineHeight:"1.8",maxWidth:"520px",marginBottom:"36px"}}>These films were misunderstood. Dismissed. Ignored by people who didn't deserve them. Enter any movie title and our AI will write the revisionist cult review it always deserved.</p>
              <div className="gen-review-box">
                <div style={{fontSize:"10px",letterSpacing:"0.4em",textTransform:"uppercase",color:"var(--yellow)",marginBottom:"10px"}}>▶ Generate A Cult Review</div>
                <p style={{fontSize:"12px",color:"#666"}}>Enter any movie title — the weirder the better.</p>
                <div className="gen-row">
                  <input className="gen-input" value={genInput} onChange={e=>setGenInput(e.target.value)} placeholder="e.g. Birdemic, Troll 2, Samurai Cop..." onKeyDown={e=>e.key==="Enter"&&!genLoading&&generateReview()}/>
                  <button className="gen-btn" onClick={generateReview} disabled={genLoading||!genInput.trim()}>{genLoading?"WRITING...":"GENERATE"}</button>
                </div>
                {genLoading && (
                  <div style={{marginTop:"24px",textAlign:"center"}}>
                    <Dots/>
                    <p style={{fontSize:"10px",color:"#444",letterSpacing:"0.3em",marginTop:"8px"}}>CONSULTING THE FILM ARCHIVE...</p>
                  </div>
                )}
                {liveReview && (
                  <div className="ai-output">
                    <div className="ai-output-badge">⚡ AI GENERATED · {liveReview.badge}</div>
                    <div className="ai-output-title">{liveReview.title}</div>
                    <div style={{color:"var(--yellow)",fontFamily:"'Bebas Neue',sans-serif",fontSize:"22px",fontStyle:"normal",marginBottom:"14px"}}>{liveReview.rating} ★</div>
                    <p>"{liveReview.full}"</p>
                    <button onClick={addToVault} style={{marginTop:"20px",background:"none",border:"1px solid var(--yellow)",color:"var(--yellow)",padding:"10px 20px",fontFamily:"'Bebas Neue',sans-serif",fontSize:"16px",letterSpacing:"2px",cursor:"pointer"}}>ADD TO VAULT →</button>
                  </div>
                )}
              </div>
              <div className="reviews-grid">
                {reviews.map((r,i)=>(
                  <div key={i} className="review-card" onClick={()=>setModalReview(r)}>
                    <div className="review-rating">{r.rating}</div>
                    <div className="review-movie">{r.title}</div>
                    <div className="review-year">{r.year||""}</div>
                    <span className="review-badge">{r.badge}</span>
                    <p className="review-excerpt">"{r.excerpt}"</p>
                    <button className="review-read-more">READ FULL REVIEW →</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab==="generator" && (
            <div className="section">
              <div className="section-label">▶ Title Generator</div>
              <h2 className="section-title">WHAT'S YOUR<br/><span className="red">TUBI ORIGINAL?</span></h2>
              <p style={{color:"#aaa",fontSize:"15px",lineHeight:"1.8",maxWidth:"520px",marginBottom:"40px"}}>Your first name, birth month, and first pet hold the secret to your destined Tubi Original. Fill in the fields. Pick a genre — or get all six.</p>
              <div className="generator-box">
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"16px",marginBottom:"28px"}}>
                  <div style={{textAlign:"left"}}>
                    <div style={{fontSize:"9px",letterSpacing:"0.3em",textTransform:"uppercase",color:"#888",marginBottom:"8px"}}>First Name</div>
                    <input value={firstName} onChange={e=>setFirstName(e.target.value)} placeholder="e.g. Dana" style={{width:"100%",background:"#080808",border:"1px solid #261e36",color:"var(--white)",fontFamily:"'Space Mono',monospace",fontSize:"12px",padding:"10px 14px",outline:"none"}}/>
                    <div style={{fontSize:"9px",color:"#444",marginTop:"5px"}}>First letter = your creature</div>
                  </div>
                  <div style={{textAlign:"left"}}>
                    <div style={{fontSize:"9px",letterSpacing:"0.3em",textTransform:"uppercase",color:"#888",marginBottom:"8px"}}>Birth Month</div>
                    <select value={birthMonth} onChange={e=>setBirthMonth(e.target.value)} style={{width:"100%",background:"#080808",border:"1px solid #261e36",color:birthMonth?"var(--white)":"#444",fontFamily:"'Space Mono',monospace",fontSize:"12px",padding:"10px 14px",outline:"none",cursor:"pointer"}}>
                      <option value="" disabled>Select...</option>
                      {["January","February","March","April","May","June","July","August","September","October","November","December"].map(m=><option key={m} value={m}>{m}</option>)}
                    </select>
                    <div style={{fontSize:"9px",color:"#444",marginTop:"5px"}}>Month = your tone</div>
                  </div>
                  <div style={{textAlign:"left"}}>
                    <div style={{fontSize:"9px",letterSpacing:"0.3em",textTransform:"uppercase",color:"#888",marginBottom:"8px"}}>First Pet's Name</div>
                    <input value={petName} onChange={e=>setPetName(e.target.value)} placeholder="e.g. Mr. Bubbles" style={{width:"100%",background:"#080808",border:"1px solid #261e36",color:"var(--white)",fontFamily:"'Space Mono',monospace",fontSize:"12px",padding:"10px 14px",outline:"none"}}/>
                    <div style={{fontSize:"9px",color:"#444",marginTop:"5px"}}>First letter = your setting</div>
                  </div>
                </div>
                <div style={{marginBottom:"28px"}}>
                  <div style={{fontSize:"9px",letterSpacing:"0.3em",textTransform:"uppercase",color:"#888",marginBottom:"12px"}}>Genre — pick one or leave blank for all six</div>
                  <div style={{display:"flex",gap:"10px",flexWrap:"wrap",justifyContent:"center"}}>
                    {Object.keys(GENRE_DATA).map(g=>(
                      <button key={g} className={`chip ${selGenre===g?"active":""}`} onClick={()=>setSelGenre(p=>p===g?"":g)}>{g}</button>
                    ))}
                  </div>
                </div>
                <div className="title-output">{titleOutput}</div>
                <div className="gen-controls" style={{marginBottom:"28px"}}>
                  <button className="btn-primary" onClick={generateTitle}>GENERATE TITLE</button>
                  <button className="btn-secondary" onClick={copyTitle} disabled={isPlaceholder(titleOutput)}>COPY & SHARE</button>
                </div>
                {titleVars.length>1 && (
                  <>
                    <div style={{fontSize:"9px",letterSpacing:"0.4em",textTransform:"uppercase",color:"var(--yellow)",marginBottom:"16px",borderTop:"1px solid #261e36",paddingTop:"28px"}}>▶ All Genre Variations</div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:"12px"}}>
                      {titleVars.map(({genre,title})=>(
                        <div key={genre} onClick={()=>setTitleOutput(title)}
                          style={{background:"#080808",border:"1px solid #261e36",padding:"18px 20px",cursor:"pointer",transition:"border-color 0.2s"}}
                          onMouseEnter={e=>e.currentTarget.style.borderColor="var(--yellow)"}
                          onMouseLeave={e=>e.currentTarget.style.borderColor="#261e36"}>
                          <div style={{fontSize:"9px",letterSpacing:"0.3em",textTransform:"uppercase",color:"var(--red)",marginBottom:"8px"}}>{genre}</div>
                          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"18px",letterSpacing:"1px",lineHeight:"1.2",color:"var(--white)"}}>{title}</div>
                        </div>
                      ))}
                    </div>
                    <p style={{fontSize:"10px",color:"#444",marginTop:"12px",letterSpacing:"0.15em"}}>Click any card to set it as your title</p>
                  </>
                )}
                {titleVars.length===1&&!isPlaceholder(titleOutput)&&(
                  <p style={{fontSize:"10px",color:"#666",letterSpacing:"0.2em"}}>SHARE: "MY TUBI ORIGINAL: {titleOutput} #BSIDE #TUBI"</p>
                )}
              </div>
            </div>
          )}

          <hr className="divider"/>
          <footer className="footer">
            <div className="footer-logo">B-SIDE</div>
            <div style={{textAlign:"center"}}>
              <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"28px",letterSpacing:"6px",color:"#888"}}>TUBI</span>
              <div style={{color:"#aaa",fontSize:"11px",lineHeight:"1.8",letterSpacing:"0.2em",marginTop:"6px"}}>500 TITLES. A FEW GOLDEN TICKETS. ZERO HINTS.</div>
            </div>
            <div style={{color:"#aaa",fontSize:"11px",letterSpacing:"0.2em"}}>© TUBI 2026</div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<BSide/>);
  </script>
</body>
</html>
